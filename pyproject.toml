[project]
name = "docket"
version = "0.1.0"
description = "Tasks, reminders and calendar sync: nothing becomes a task without approval, and no reminder is lost."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16,<3",
    "typer>=0.27,<1",
    "keyring>=25.7,<26",
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "mcp>=2.3,<2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "httpx2>=2.16,<3",
]

[project.scripts]
docket = "docket.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["docket", "docket_tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=docket --cov=docket_tools --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
show_missing = true
